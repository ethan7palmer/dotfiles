# Kitty's default `shell .` means "use $SHELL, falling back to the passwd
# default shell" — but $SHELL is inherited from the desktop session's
# environment at login, not re-read after `chsh`, so a GUI-launched Kitty
# can keep opening bash even after the default shell is changed to zsh
# until a full desktop logout/login. Force it directly instead.
shell zsh

# Hack Nerd Font Mono — installed by scripts/02-nerd-font.sh (no apt
# package exists for it). The "Mono" variant specifically, since terminals
# need strictly fixed-width glyphs, including the icon/symbol ones.
font_family Hack Nerd Font Mono

# Rosé Pine Moon — kept in its own file so it's swappable without touching
# this one. Regenerate/change with:
# kitty +kitten themes --dump-theme "<name>" > .config/kitty/theme.conf
include theme.conf

# Slightly transparent background. Needs compositor support — GNOME's
# Wayland session (this repo's target desktop) has that built in, no extra
# package needed. 1.0 = opaque, 0.0 = fully transparent.
#
# Raised from 0.85: the desktop wallpaper this repo sets has a wide
# brightness range (near-black to near-white regions in the same image, not
# just a uniformly dark or light photo), so no single terminal background
# color blends well against all of it at once - text contrast was fine over
# the wallpaper's dark patches and poor over its bright ones. A higher
# opacity leans on the terminal's own colors more and the wallpaper less,
# which fixes that regardless of which part of the image sits behind the
# window. Still not fully opaque, so the transparency effect is kept.
background_opacity 0.95

# OS window titlebar color — Rosé Pine's "rose", a lighter/softer pink than
# "love" (which reads more red - that's what gitsigns' delete color uses in
# nvim's colorscheme.lua). Only takes effect on Wayland with client-side
# decorations, e.g. GNOME (this repo's target desktop) — has no effect at
# all under X11, where the window manager draws the titlebar instead of
# kitty.
wayland_titlebar_color #ea9a97
