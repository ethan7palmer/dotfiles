# ~/.local/bin holds user-installed binaries (herdr, Godot, ...) that are
# on PATH for interactive shells via .bashrc/.zshrc, but NOT for anything
# started by the systemd --user session - which is what actually launches
# gnome-shell and, through it, any GUI app (e.g. clicking Godot's
# .desktop entry: gnome-shell's own PATH doesn't include ~/.local/bin,
# so `Exec=godot` fails to resolve even though the app shows up fine).
#
# Named 999- (well outside environment.d's own recommended 60-90 range
# for local files) on purpose: /etc/environment is parsed as if it were
# 99-environment.conf (see /usr/lib/environment.d/99-environment.conf,
# a symlink to it), and Ubuntu's snapd ships 990-snapd.conf appending
# /snap/bin - environment.d applies whichever file sets a given key
# *last* in filename-sorted order, so anything named lower than either
# would have its PATH silently replaced by theirs instead of extending
# it. This has to sort after both.
PATH=${HOME}/.local/bin:${PATH}
