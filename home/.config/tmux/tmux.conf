# Keybindings deliberately mirror herdr's (~/.config/herdr/config.toml's
# [keys] table, prefix = ctrl+b) so switching between herdr and tmux
# doesn't mean re-learning muscle memory. Only rebinding what herdr's
# config actually differs from tmux's own defaults on - see each comment.
# Change one config, update the other to match (mux-keys in
# home/.bash_functions shows both at once).
# Full herdr config reference: https://herdr.dev/docs/configuration/

# Same default prefix as herdr - set explicitly so this doesn't silently
# change if a future tmux default ever does.
set -g prefix C-b

# tmux defaults this to off, which silently swallows the distinction
# between e.g. Down and Ctrl+Alt+Down before it ever reaches a program
# running inside tmux (nvim's multicursor.nvim keymaps included) - even
# though the outer terminal (kitty) supports sending it fine on its own.
set -g extended-keys on

# tmux defaults to detaching the client entirely when the session it's
# attached to gets killed (close_workspace/kill_all_workspaces below),
# even if other sessions are still running - switch to the most recently
# active remaining one instead, matching herdr's behavior on workspace close.
set -g detach-on-destroy off

# Pane focus (prefix + Up/Down/Left/Right) and zoom (prefix+z) already
# match tmux's own defaults - nothing to rebind for either.

# close_pane/close_tab/close_workspace all follow prefix+shift+<the key
# that opens/creates the equivalent thing> below - close_pane is the one
# exception, since panes have two opening keys (split_horizontal/
# split_vertical below) and no single one to shift.
#
# close_pane: prefix+shift+c (tmux's own default for capital C is
# customize-mode, overridden here) with no confirmation, matching herdr.
unbind C
bind C kill-pane

# split_horizontal/split_vertical: herdr names these after the split
# LINE's orientation, not the resulting pane layout - a "horizontal"
# split draws a horizontal line and stacks panes top/bottom; "vertical"
# puts them side by side. That reads backwards at a glance, and it's
# also the opposite of tmux's own -h/-v flags (tmux's -h arranges panes
# horizontally, i.e. side by side) - so these two are intentionally
# swapped relative to tmux's own % and " defaults, to land on the same
# visual result as herdr for the same key.
bind h split-window -v
bind v split-window -h

# new_tab: herdr's "tab" is tmux's "window". tmux's own default for t is
# clock-mode - overridden to match herdr's t=new.
unbind t
bind t new-window

# close_tab: prefix+shift+t, matching new_tab's key above. tmux has no
# default binding on capital T.
bind T kill-window

# new_workspace: herdr's "workspace" is tmux's "session". tmux's own
# default for w is choose-tree -Zw (a window picker) - overridden since
# goto below already covers picking/switching, and herdr's own goto
# likewise doubles as the session/tab picker. new-session run from an
# already-attached client creates a fresh session and switches this
# client straight into it, the same "create and jump in" behavior herdr's
# new_workspace has.
unbind w
bind w new-session

# goto: herdr's session/tab picker. tmux has no default binding here;
# choose-tree's auto-zoomed tree view is the closest match - no -s, so
# sessions show already expanded with their windows visible instead of
# needing a manual + first.
bind g choose-tree -Z

# detach: prefix+shift+d. tmux's own default detach key is already
# lowercase d (unchanged, still works as a bonus alias) - capital D
# defaults to choose-client, overridden here to match herdr's shift+d.
unbind D
bind D detach-client

# close_workspace: prefix+shift+w, matching new_workspace's key above -
# kills the session and everything running in it, unlike detach above
# which just disconnects and leaves it running. tmux has no default
# binding on capital W. Kept behind a confirmation (unlike close_pane
# above) since killing a whole session - every window and pane in it - is
# a lot harder to walk back than one pane. -y makes Enter alone confirm
# (tmux's own default only accepts the literal "y" key and ignores
# Enter) - Escape/any other key already cancels by default, matching
# herdr's Enter-to-confirm/Esc-to-cancel.
bind W confirm-before -y -p "Kill session #S? (Enter to confirm, Esc to cancel)" kill-session

# kill_all_workspaces: no herdr default does this either - a new keybind
# on both sides, not a herdr default being mirrored (see the matching
# [[keys.command]] in home/.config/herdr/config.toml). kill-server tears
# down every session on the server at once, tmux's equivalent of herdr's
# "close every workspace" custom command.
bind K confirm-before -y -p "Kill ALL sessions? (Enter to confirm, Esc to cancel)" kill-server
